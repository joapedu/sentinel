quarkus.http.port=8080
quarkus.http.root-path=/
quarkus.datasource.db-kind=postgresql
quarkus.datasource.jdbc.url=${DB_JDBC_URL:jdbc:postgresql://localhost:5432/sentinel}
quarkus.datasource.username=${DB_USERNAME:sentinel}
quarkus.datasource.password=${DB_PASSWORD:sentinel}
quarkus.hibernate-orm.database.generation=validate
quarkus.flyway.migrate-at-start=true

mp.jwt.verify.issuer=${JWT_ISSUER:sentinel-core}
mp.jwt.verify.audiences=${JWT_AUDIENCE:sentinel-api}
mp.jwt.verify.publickey.location=${JWT_PUBLIC_KEY:publicKey.pem}
smallrye.jwt.sign.key.location=${JWT_PRIVATE_KEY:privateKey.pem}
smallrye.jwt.new-token.issuer=${JWT_ISSUER:sentinel-core}
smallrye.jwt.new-token.audience=${JWT_AUDIENCE:sentinel-api}

sentinel.auth.access-token-minutes=${AUTH_ACCESS_TOKEN_MINUTES:15}
sentinel.auth.refresh-token-days=${AUTH_REFRESH_TOKEN_DAYS:30}
quarkus.http.cors=true
quarkus.http.cors.origins=${CORS_ORIGINS:http://localhost:3000}
quarkus.http.cors.methods=GET,POST,PUT,PATCH,DELETE,OPTIONS
quarkus.http.cors.headers=accept,authorization,content-type,x-csrf-token

%test.quarkus.datasource.db-kind=h2
%test.quarkus.datasource.jdbc.url=jdbc:h2:mem:sentinel;MODE=PostgreSQL;DB_CLOSE_DELAY=-1
%test.quarkus.datasource.username=sa
%test.quarkus.datasource.password=sa
%test.quarkus.hibernate-orm.database.generation=validate
%test.quarkus.flyway.migrate-at-start=true
%test.mp.jwt.verify.publickey.location=publicKey.pem
%test.smallrye.jwt.sign.key.location=privateKey.pem